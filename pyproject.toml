[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ribline"
version = "0.3.1"
description = "Hybrid Semantic Context Forests, 3D U-Net, and Kyphosis-Aware Deformable Topology Matching for 3D Rib Centerline Tracing and Anatomical Labeling"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  {name = "Quan Wang"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "scikit-image",
    "joblib",
    "jsonschema",
    "pandas",
    "SimpleITK",
    "networkx",
    "tqdm",
    "huggingface_hub>=0.20.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0"]
dev = ["build", "twine"]

[project.scripts]
ribline-sota = "ribline.pipeline.pipeline_sota:main"
ribline-evaluate = "ribline.pipeline.evaluate:main"
ribline-train-scf = "ribline.scripts.train_anatomical_scf:main"
ribline-train-unet = "ribline.scripts.train_unet:main"
ribline-infer-scf = "ribline.scripts.infer_anatomical_scf:main"
ribline-infer-unet = "ribline.scripts.infer_unet:main"
ribline-stage3 = "ribline.scripts.run_stage3:main"
ribline-cv5 = "ribline.scripts.run_cv5:main"

[project.urls]
"Homepage" = "https://github.com/wq2012/ribline"
"Paper" = "https://arxiv.org/abs/2610.16047"
"Pretrained Models" = "https://huggingface.co/collections/wq2012/ribline"

[tool.setuptools.packages.find]
include = ["ribline*"]
exclude = ["experiments*"]

[tool.setuptools.package-data]
ribline = ["configs/*.json", "configs/*.joblib"]
